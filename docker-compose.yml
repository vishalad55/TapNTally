# Production-shaped local stack: Postgres + Redis + API.
# For zero-install dev, skip this and run `npm run dev:backend` (sql.js + in-process queue).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tapntally
      POSTGRES_PASSWORD: tapntally
      POSTGRES_DB: tapntally
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapntally"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DRIVER: postgres
      DATABASE_URL: postgres://tapntally:tapntally@postgres:5432/tapntally
      DB_SYNCHRONIZE: "false"
      REDIS_URL: redis://redis:6379
      AUTH_DEV_LOGIN: "false"
      # Override these via a .env file next to this compose file.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports: ["3000:3000"]

volumes:
  pgdata:
