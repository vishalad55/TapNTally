name: tapntally
description: "TapNTally — tap your phone after you pay; the bill files itself. Flutter client."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  intl: ^0.20.3
  nfc_manager: ^4.3.0
  nfc_manager_ndef: ^1.1.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Brand fonts are bundled (not fetched at runtime): no font pop-in, works offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_400Regular.ttf
        - asset: assets/fonts/Inter_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_700Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk_500Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk_700Bold.ttf
          weight: 700
